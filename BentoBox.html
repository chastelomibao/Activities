<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body data-bs-theme="dark">
  <div class="container-fluid p-0">
    <div class="row bento-row g-0">

      <!-- left box playlist -->
      <div class="col-12 col-lg-3 order-2 order-lg-1 p-1">
        <div class="card playlist-card h-100">
          <div class="pl-header">
            <div class="pl-cover"><i class="bi bi-music-note-beamed"></i></div>
            <div class="pl-meta">
              <span class="pl-label">PLAYLIST</span>
              <h1 class="pl-title">Music Playlist</h1>
              <span class="pl-count" id="plCount">0 songs</span>
            </div>
          </div>
          <ul class="pl-list" id="plList"></ul>
        </div>
      </div>

      <!-- main video + controls -->
      <div class="col-12 col-lg-6 order-1 order-lg-2 d-flex flex-column">
        <div class="p-1 flex-grow-1 d-flex">
          <div class="card video-card w-100" id="videoCard">
            <video id="player" playsinline preload="metadata"></video>
            <div class="video-empty">
              <i class="bi bi-film"></i>
              <span>Pick a song from the playlist</span>
            </div>
          </div>
        </div>

        <div class="p-1 controls-wrap">
          <!-- half spinning disc -->
          <div class="disc-wrap">
            <div class="disc"></div>
          </div>

          <div class="card controls-card">
            <!-- progress -->
            <div class="progress-row">
              <span class="time" id="curTime">0:00</span>
              <input type="range" class="slider" id="seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
              <span class="time" id="durTime">0:00</span>
            </div>

            <div class="bar-row">
              <!-- now playing -->
              <div class="now">
                <div class="now-cover" id="nowCover"></div>
                <div class="now-text">
                  <div class="now-title" id="nowTitle">Nothing playing</div>
                  <div class="now-artist" id="nowArtist">&nbsp;</div>
                </div>
              </div>

              <!-- transport -->
              <div class="transport">
                <button class="ctl" id="shuffleBtn" title="Shuffle" aria-pressed="false">
                  <i class="bi bi-shuffle"></i>
                </button>
                <button class="ctl ctl-main" id="prevBtn" title="Previous">
                  <i class="bi bi-skip-start-fill"></i>
                </button>
                <button class="ctl ctl-skip" id="backBtn" title="Back 30 sec">
                  <i class="bi bi-arrow-counterclockwise"></i><span>30</span>
                </button>
                <button class="play" id="playBtn" title="Play / Pause">
                  <i class="bi bi-play-fill"></i>
                </button>
                <button class="ctl ctl-skip" id="fwdBtn" title="Forward 30 sec">
                  <i class="bi bi-arrow-clockwise"></i><span>30</span>
                </button>
                <button class="ctl ctl-main" id="nextBtn" title="Next">
                  <i class="bi bi-skip-end-fill"></i>
                </button>
                <button class="ctl" id="repeatBtn" title="Repeat: off">
                  <i class="bi bi-repeat"></i>
                </button>
              </div>

              <!-- volume -->
              <div class="vol">
                <button class="ctl" id="muteBtn" title="Mute">
                  <i class="bi bi-volume-up-fill"></i>
                </button>
                <input type="range" class="slider" id="volume" min="0" max="1" step="0.01" value="0.8"
                  aria-label="Volume">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- right box small, tall, small -->
      <div class="col-12 col-lg-3 order-3 d-flex flex-column">
        <div class="p-1">
          <div class="card p-1"></div>
        </div>
        <div class="p-1 flex-grow-1 d-flex">
          <div class="card lyrics-card w-100">
            <div class="lyrics-scroll empty" id="lyrics">
              <p class="lyrics-empty">No lyrics for this song</p>
            </div>
          </div>
        </div>
        <div class="p-1">
          <div class="card p-1"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script src="script.js"></script>
</body>

</html>
