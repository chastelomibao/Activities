<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bento</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .card {
      min-height: 180px;
    }

    .bento-row {
      height: 100vh;
      height: 100dvh;
    }

    /* responsive*/
    @media (max-width: 991.98px) {
      .bento-row {
        height: auto;
      }

      .video-card {
        aspect-ratio: 16 / 9;
        min-height: 0;
      }

      .lyrics-card {
        min-height: 260px;
      }

      .vibe-card {
        min-height: 220px;
      }
    }
  </style>
</head>

<body data-bs-theme="dark">
  <div class="container-fluid p-0">
    <div class="row bento-row g-0">

      <!--left na box-->
      <div class="col-12 col-lg-3 order-2 order-lg-1 p-1">
        <div class="card lyrics-card p-1 h-100">lyrics maybe</div>
      </div>

      <!-- video and playlist control -->
      <div class="col-12 col-lg-6 order-1 order-lg-2 d-flex flex-column">
        <div class="p-1 flex-grow-1 d-flex">
          <div class="card video-card p-1 w-100">main video</div>
        </div>
        <div class="p-1">
          <div class="card p-1">playlist / play / skip / etc</div>
        </div>
      </div>

      <!-- right boxes, top small, mid tall, bottom liit-->
      <div class="col-12 col-lg-3 order-3 d-flex flex-column">
        <div class="p-1">
          <div class="card p-1"></div>
        </div>
        <div class="p-1 flex-grow-1 d-flex">
          <div class="card vibe-card p-1 w-100">pictures / music vibe</div>
        </div>
        <div class="p-1">
          <div class="card p-1"></div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
